<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScreenTime Bank</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#f0f4ff;color:#222}
  header{background:#4f46e5;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
  header h1{font-size:20px;margin:0}
  main{max-width:600px;margin:auto;padding:16px}
  .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
  button{background:#4f46e5;color:#fff;border:none;border-radius:8px;padding:10px 14px;font-size:15px;cursor:pointer;margin:4px 4px 4px 0}
  button.gray{background:#888} button.red{background:#dc2626} button.green{background:#16a34a}
  button.wide{display:block;width:100%;padding:14px;font-size:17px}
  input,select,textarea{width:100%;padding:10px;font-size:15px;border:1px solid #ccc;border-radius:8px;margin:6px 0 10px;box-sizing:border-box}
  input[type=checkbox]{width:auto;margin:0 8px 0 0}
  label.check{display:flex;align-items:center;margin:8px 0;font-size:14px}
  .balance{font-size:48px;font-weight:bold;color:#4f46e5;text-align:center}
  .timer{font-size:48px;font-weight:bold;color:#16a34a;text-align:center}
  .code{font-size:34px;letter-spacing:6px;font-weight:bold;text-align:center;color:#4f46e5;background:#eef;border-radius:8px;padding:10px;margin:8px 0}
  img.proof{max-width:100%;border-radius:8px;margin:8px 0;background:#eee;min-height:40px}
  .row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:8px 0;gap:8px}
  .muted{color:#777;font-size:13px}
  .center{text-align:center}
  .pending{color:#d97706}.approved{color:#16a34a}.rejected{color:#dc2626}
  .plus{color:#16a34a;font-weight:bold}.minus{color:#dc2626;font-weight:bold}
</style>
</head>
<body>
<header>
  <h1>⏱️ ScreenTime Bank</h1>
  <button id="outBtn" class="gray" onclick="logout()" style="display:none">Log out</button>
</header>
<main id="app"></main>

<script>
// ---------- SETUP ----------
const SKEY = 'stbSession';
let session = JSON.parse(localStorage.getItem(SKEY) || 'null'); // {token, role, kidName}
let state = null;        // data loaded from the server
let screen = 'welcome';  // which screen to show when logged out
let joinInfo = null;     // kid join step 2 info
let photoCache = {};
let sending = false;

const app = document.getElementById('app');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when = t => new Date(t).toLocaleString();
const fmt = ms => { ms = Math.max(0, ms); return `${Math.floor(ms / 60000)}:${String(Math.floor(ms % 60000 / 1000)).padStart(2, '0')}`; };
const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;

// ---------- TALK TO THE SERVER ----------
async function api(path, payload) {
  try {
    const r = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    let j;
    try { j = await r.json(); }
    catch { j = { error: r.status === 404 ? 'This feature is not set up yet.' : 'Server error (' + r.status + ')' }; }
    if (!r.ok && !j.error) j.error = 'Server error (' + r.status + ')';
    if (j.loggedOut) { clearSession(); render(); }
    return j;
  } catch (e) {
    return { error: 'No internet connection. Try again.' };
  }
}

const data = (action, extra = {}) => api('/api/data', { token: session?.token, tz, action, ...extra });

function setSession(r) {
  session = { token: r.token, role: r.role, kidName: r.kidName || null };
  localStorage.setItem(SKEY, JSON.stringify(session));
}
function clearSession() {
  session = null; state = null; photoCache = {};
  localStorage.removeItem(SKEY);
  screen = 'welcome';
}

async function refresh() {
  if (!session) return render();
  if (!state) app.innerHTML = '<div class="card center">Loading... ⏳</div>';
  const d = await data('load');
  if (!session) return render();
  if (d.error) {
    app.innerHTML = `<div class="card"><p>⚠️ ${esc(d.error)}</p><button onclick="refresh()">Try again</button></div>`;
    return;
  }
  state = d;
  render();
}

// ---------- SCREENS ----------
function render() {
  $('outBtn').style.display = session ? 'block' : 'none';
  if (!session) {
    if (screen === 'register') return registerScreen();
    if (screen === 'login') return loginScreen();
    if (screen === 'join') return joinScreen();
    return welcomeScreen();
  }
  if (!state) return refresh();
  state.role === 'parent' ? parentScreen() : kidScreen();
}

function go(s) { screen = s; joinInfo = null; render(); }

function welcomeScreen() {
  app.innerHTML = `
    <div class="card center">
      <h2>Welcome! 👋</h2>
      <p>Finish homework and chores, earn screen time.</p>
      <button class="wide" onclick="go('register')">👨‍👩‍👧 Create a family (parents)</button>
      <button class="wide gray" onclick="go('login')">🔑 Parent log in</button>
      <button class="wide green" onclick="go('join')">🧒 I'm a kid</button>
    </div>`;
}

function registerScreen() {
  app.innerHTML = `
    <div class="card">
      <h2>Create a family</h2>
      <p class="muted">For parents and guardians only.</p>
      <input id="fam" placeholder="Family name (e.g. The Smiths)">
      <input id="email" type="email" placeholder="Parent email">
      <input id="pw" type="password" placeholder="Password (8+ characters)">
      <label class="check"><input id="consent" type="checkbox">
        I am a parent or guardian and agree to use this app with my children.</label>
      <button class="wide" onclick="doRegister()">Create family</button>
      <button class="gray" onclick="go('welcome')">← Back</button>
    </div>`;
}

async function doRegister() {
  const r = await api('/api/auth', {
    action: 'register',
    familyName: $('fam').value,
    email: $('email').value,
    password: $('pw').value,
    consent: $('
